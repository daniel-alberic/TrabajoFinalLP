<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@100;300;400;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Formulario de Inscripción</title>
  </head>
  <body>
    <main>
      <section class="seccion">
        <h1 class="titulo">Formulario de Inscripción Curso</h1>
        <p class="titulo-parrafo">
          Rellene cuidadosamente el formulario de Inscripción
        </p>

        <form action="php/enviar.php" method="post">
          <!-- Nombre del alumno -->
          <fieldset>
            <legend><h2>Nombre del alumno</h2></legend>

            <div>
              <input
                type="text"
                name="name"
                id="name"
                placeholder="Name"
                required
              />
              <label for="name"><p>Name</p></label>
            </div>

            <div>
              <input
                type="text"
                name="middle_name"
                id="middle_name"
                placeholder="Middle Name"
              />
              <label for="middle_name"><p>Middle Name</p></label>
            </div>

            <div>
              <input
                type="text"
                name="last_name"
                id="last_name"
                placeholder="Last Name"
              />
              <label for="Last_Name"><p>Last Name</p></label>
            </div>
          </fieldset>

          <!-- Fecha de nacimiento y Género -->
          <div>
            <div>
              <label for="birthdate"><p>Birthdate</p></label>
              <input type="date" name="birthdate" id="birthdate" />
              <small><p>Date</p></small>
            </div>

            <div>
              <label for="gender"><p>Gender</p></label>
              <select name="gender" id="gender">
                <option value="" disabled selected><p>Select</p></option>
                <option value="masculine"><p>Masculine</p></option>
                <option value="feminine"><p>Feminine</p></option>
              </select>
            </div>
          </div>

          <!-- Dirección -->
          <fieldset>
            <legend><h2>Dirección</h2></legend>
            <div>
              <input
                type="text"
                name="address_1"
                id="address_1"
                placeholder="Street address"
              />
              <label for="address_1"><p>Street address</p></label>
            </div>

            <div>
              <input
                type="text"
                name="address_2"
                id="address_2"
                placeholder="Street address, Line 2"
              />
              <label for="address_2"><p>Street Address for Line 2</p></label>
            </div>

            <div>
              <div>
                <input type="text" name="city" id="city" placeholder="city" />
                <label for="city"><p>City</p></label>
              </div>

              <div>
                <input
                  type="text"
                  name="state"
                  id="state"
                  placeholder="State"
                />
                <label for="state"><p>State / Province</p></label>
              </div>
            </div>

            <div>
              <input
                type="text"
                name="zip_code"
                id="zip_code"
                placeholder="Zip Code"
              />
              <label for="zip_code"><p>Zip Code</p></label>
            </div>
          </fieldset>

          <!-- Email y Teléfono -->
          <div>
            <div>
              <label for="email"><p>Email</p></label>
              <input
                type="email"
                name="email"
                id="email"
                placeholder="ejemplo@ejemplo.com"
                required
              />
            </div>
            <div>
              <label for="phone"><p>Phone Number</p></label>
              <input
                type="phone"
                name="phone"
                id="phone"
                placeholder="(000) 000-0000"
              />
              <small>Please enter a valid phone number.</small>
            </div>
          </div>

          <!-- Has recibido otros cursos anteriormente? -->
          <div>
            <label><h3>Ha recibido otros cursos Anteriormente?</h3></label>
            <div>
              <input type="radio" name="cursos_previos" id="si" value="si" />
              <label for="yes">Yes</label>
            </div>
            <div>
              <input type="radio" name="cursos_previos" id="no" value="no" />
              <label for="no">No</label>
            </div>
          </div>

          <!-- Empresa y Cursos -->
          <div>
            <div>
              <label for="company"><h2>Company</h2></label>
              <input type="text" name="company" id="company" />
            </div>
            <div>
              <label for="courses"><h2>Courses</h2></label>
              <select name="courses" id="courses">
                <option value="">Select</option>
                <option value="logic">Web Logic and Programming</option>
                <option value="web_development">Web Development</option>
                <option value="cybersecurity">Cybersecurity</option>
              </select>
            </div>
          </div>

          <!-- Comentarios adicionales -->
          <div>
            <label for="comments"><p>additional comments</p></label>
            <textarea name="comments" id="comments" rows="5"></textarea>
          </div>

          <!-- Botón Enviar -->
          <div>
            <button type="submit">Send</button>
          </div>
        </form>
      </section>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
